"$schema" = "./node_modules/wrangler/config-schema.json"
name = "testsetu"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-08-17"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [ "/*" ]

[vars]
# Render-hosted Node.js TestSetu API. No file/object storage binding is used.
BACKEND_ORIGIN = "https://your-render-backend.onrender.com"
